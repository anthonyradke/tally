[project]
name = "tally"
version = "3.0.2"
description = "Personal finance tracker: From/To ledger with derived balances"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.1",
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["ios"]

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E401", "E731", "B008", "E501", "B904", "B007"]
