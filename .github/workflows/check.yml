# Every push to main: the backend tests (with the API contract check against the app's types), ruff, and the app's
# tests, type check and lint. Nothing deploys from here.
name: check
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ios/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          (cd ios && npm ci --no-audit --no-fund)
          uv sync --frozen
      - name: Backend
        run: |
          uv run ruff check .
          uv run pytest -q
      - name: App
        working-directory: ios
        run: |
          npm test
          npm run typecheck
          npx expo lint
