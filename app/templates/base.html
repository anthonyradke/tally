<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<title>{% block title %}Money{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/static/htmx.min.js" defer></script><script src="/static/ui.js" defer></script></head><body>
{% set path = request.url.path %}
